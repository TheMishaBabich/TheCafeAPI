services:
  nginx:
    image: nginx:latest
    container_name: thecafe_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cafe_network

  app:
    container_name: thecafe_app
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/thecafe
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    networks:
      - cafe_network

  db:
    image: postgres:15
    container_name: thecafe_db
    environment:
      - POSTGRES_DB=thecafe
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cafe_network

volumes:
  postgres_data:

networks:
  cafe_network:
    driver: bridge